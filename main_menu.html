<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco Argentino - Versión Básica</title>
  <script type="module" src="./js/main.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-green-800 text-white flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-3xl font-bold mb-4">Truco Argentino (Beta)</h1>
  <div id="game-area" class="bg-green-700 p-6 rounded-2xl shadow-lg w-full max-w-2xl">
    <div id="status" class="text-center mb-4 text-lg"></div>

    <div id="player1" class="mb-6">
      <h2 class="font-semibold mb-2">Jugador 1</h2>
      <div class="flex space-x-2" id="player1-cards"></div>
    </div>

    <div id="player2" class="mb-6">
      <h2 class="font-semibold mb-2">Jugador 2</h2>
      <div class="flex space-x-2" id="player2-cards"></div>
    </div>

    <div class="flex justify-center space-x-4">
      <button id="btn-new-game" class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 rounded-lg font-semibold">Nueva Partida</button>
      <button id="btn-next-round" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-semibold">Siguiente Mano</button>
    </div>
  </div>
</body>
</html>
